project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - projects/index.qmd
    - projects/iris-eda/index.qmd
    - projects/unicon-eda/index.qmd
    - projects/ai-sustainability-essay/index.qmd
  resources:
    - "assets/js/**"
    - "assets/images/**"
    - CNAME

website:
  title: "Daniel Huencho | AI Engineer"
  favicon: assets/images/favicon.ico
  navbar:
    background: "#1b2838"
    foreground: "#e2e8f0"
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: projects/index.qmd
        text: Projects
    right:
      - icon: github
        href: https://github.com/choka30
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/daniel-huencho-mardini-9568489a/
        aria-label: LinkedIn

execute:
  freeze: auto

format:
  html:
    theme: [cosmo, custom.scss]
    css: custom.scss
    toc: false
    page-layout: full
    grid:
      body-width: 1200px
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
